[package]
name = "note67"
version = "0.1.26"
description = "A private, local notes assistant"
authors = ["you"]
license = "AGPL-3.0-or-later"
edition = "2024"

[lib]
name = "note67_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
cpal = "0.15"
hound = "3.5"
symphonia = { version = "0.5", features = ["mp3", "aac", "alac", "flac", "ogg", "wav", "isomp4", "mkv"] }
whisper-rs = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "macros", "time"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"
scopeguard = "1.2"
regex = "1"

# macOS-specific dependencies for system audio capture via ScreenCaptureKit
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSError", "NSString", "NSArray", "NSDictionary", "NSNotification", "NSThread"] }
block2 = "0.6"
core-graphics = "0.24"
core-foundation = "0.10"

# Windows-specific dependencies for system audio capture via WASAPI loopback
[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.16"

[dev-dependencies]
# The mock runtime, to check the capability file against the real config.
tauri = { version = "2", features = ["test"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
